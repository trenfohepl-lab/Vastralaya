<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Arun Vastralaya — Admin</title>
<style>
:root{--m:#7f1d1d;--g:#d9a441;--bg:#fff8ee;--tx:#2a1a14;--mu:#7a6a60;--ln:#eadfce}
*{box-sizing:border-box;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}.hide{display:none!important}.w{max-width:860px;margin:0 auto;padding:14px}
header{position:sticky;top:0;z-index:20;background:var(--m);color:#fff;padding-top:env(safe-area-inset-top)}header .w{display:flex;justify-content:space-between;align-items:center;padding-bottom:6px}
h1{font-size:17px}.tabs{display:flex;gap:6px;max-width:860px;margin:0 auto;padding:0 14px 10px;overflow-x:auto}
.tab{flex:none;padding:8px 14px;border-radius:99px;border:0;background:#ffffff22;color:#fff;font-weight:700;font-size:13px;cursor:pointer}.tab.on{background:var(--g);color:#3b1d05}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;background:#f3e8d8;text-decoration:none;display:inline-block}.pri{background:var(--m);color:#fff}.red{background:#fee2e2;color:#b91c1c}.sm{padding:6px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bt{justify-content:space-between}
input,select,textarea{width:100%;background:#fffdf8;border:1px solid var(--ln);border-radius:10px;padding:10px;font-size:14px}input[type=checkbox]{width:auto}input[type=color]{padding:2px;height:40px}
label{display:block;font-size:12px;color:var(--mu);font-weight:600;margin-bottom:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px}.stat b{font-size:20px;display:block}.stat small,.note{color:var(--mu);font-size:12px;line-height:1.5}
.bd{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:6px}.in{background:#dcfce7;color:#166534}.out{background:#fee2e2;color:#b91c1c}
.th{flex:none;width:44px;height:44px;border-radius:10px;object-fit:cover;display:inline-grid;place-items:center;font-size:22px;vertical-align:middle;margin-right:8px}
#md{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}#md .bx{background:#fff;width:100%;max-width:680px;max-height:92vh;overflow:auto;padding:16px;border-radius:18px 18px 0 0}
@media(min-width:700px){#md{align-items:center}#md .bx{border-radius:18px}}
#t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a1a14;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:90}#t.on{opacity:1}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}.lg .card{width:100%;max-width:340px}
</style></head><body>
<div id="lg" class="lg"><div class="card"><h1 style="margin-bottom:4px">Arun Vastralaya Admin</h1><p class="note" style="margin-bottom:12px">Shop control panel. Enter your password.</p><input id="pw" type="password" placeholder="Password"><button class="btn pri" style="width:100%;margin-top:10px" onclick="login()">Login</button><p class="note" style="margin-top:10px">First-time password: <b>admin123</b> (change it in the Shop tab)</p></div></div>
<div id="app" class="hide"><header><div class="w"><h1>Arun Vastralaya <span style="opacity:.7;font-weight:400">Admin</span></h1><div class="row"><a class="btn sm" href="index.html" target="_blank">Website ↗</a><button class="btn sm" onclick="logout()">Logout</button></div></div><div class="tabs" id="tabs"></div></header><main class="w" id="main"></main></div>
<div id="md" class="hide" onclick="if(event.target===this)cm()"><div class="bx" id="bx"></div></div><div id="t"></div>
<script>
const KEY='av_data_en',PW='av_pw',$=s=>document.querySelector(s),inr=n=>'₹'+Number(n||0).toLocaleString('en-IN'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DB=null,tab='p',q='',ph='';
const tt=m=>{const t=$('#t');t.textContent=m;t.classList.add('on');clearTimeout(tt.x);tt.x=setTimeout(()=>t.classList.remove('on'),1800)};
function save(m){try{localStorage.setItem(KEY,JSON.stringify(DB));tt(m||'Saved ✓')}catch(e){tt('Storage full — use smaller or fewer photos')}}
const DEF={"STORE":{"name":"Arun Vastralaya","en":"Arun Vastralaya","whatsapp":"919838211528","phone":"+919838211528","short":"Mahona Market","address":"Mahona Market, near Sadab Bhai Book Depot","openHour":10,"closeHour":21,"hours":"Open daily, 10 AM to 9 PM","delivery":"Free around Mahona","offer":"💍 Wedding Season Offer: ₹200 off on purchases above ₹2000 — order on WhatsApp!","hero":"Weddings or festivals — clothes for the whole family, under one roof","heroSub":"Sarees, kurtas, suits, jeans, kids' wear and winter clothing. Pick your favourites, choose a size, and send your order on WhatsApp."},"CATS":["Saree","Men","Women","Kids","Winter"],"P":[
{"id":1,"cat":"Saree","name":"Banarasi Silk Saree","price":1899,"mrp":2999,"sizes":["Free Size"],"color":"#9f1239","emoji":"🥻","stock":true,"tag":"Wedding Special","desc":"Banarasi-style silk saree with zari border. Blouse piece included."},
{"id":2,"cat":"Saree","name":"Cotton Printed Saree","price":649,"mrp":999,"sizes":["Free Size"],"color":"#0f766e","emoji":"🥻","stock":true,"tag":"Daily Wear","desc":"Light, comfortable cotton. Best for everyday wear."},
{"id":3,"cat":"Men","name":"Men Cotton Shirt","price":599,"mrp":999,"sizes":["M","L","XL","XXL"],"color":"#1d4ed8","emoji":"👔","stock":true,"tag":"Best Seller","desc":"Soft cotton, regular fit. Great for office and family functions."},
{"id":4,"cat":"Men","name":"Kurta Pajama Set","price":1299,"mrp":1999,"sizes":["M","L","XL","XXL"],"color":"#92400e","emoji":"👘","stock":true,"tag":"Festive","desc":"For weddings and festivals. Kurta and pajama in one set."},
{"id":5,"cat":"Men","name":"Stretch Denim Jeans","price":899,"mrp":1499,"sizes":["30","32","34","36"],"color":"#1e3a8a","emoji":"👖","stock":true,"tag":"","desc":"Comfortable stretch denim, slim fit."},
{"id":6,"cat":"Women","name":"Anarkali Suit Set","price":1499,"mrp":2499,"sizes":["S","M","L","XL"],"color":"#be185d","emoji":"👗","stock":true,"tag":"New","desc":"Complete set with dupatta. Stunning for functions."},
{"id":7,"cat":"Women","name":"Cotton Kurti","price":499,"mrp":799,"sizes":["S","M","L","XL","XXL"],"color":"#7c3aed","emoji":"👚","stock":true,"tag":"Hot Deal","desc":"Printed kurti for daily wear, colour-fast."},
{"id":8,"cat":"Women","name":"Leggings (Pack of 2)","price":299,"mrp":498,"sizes":["Free Size"],"color":"#334155","emoji":"🩱","stock":false,"tag":"","desc":"Stretchable, great fit."},
{"id":9,"cat":"Kids","name":"Girls Party Frock","price":699,"mrp":1099,"sizes":["2-3Y","4-5Y","6-7Y","8-9Y"],"color":"#db2777","emoji":"👗","stock":true,"tag":"Cute","desc":"Net and satin frock, comfortable for kids."},
{"id":10,"cat":"Kids","name":"Boys Kurta Set","price":799,"mrp":1199,"sizes":["2-3Y","4-5Y","6-7Y","8-9Y"],"color":"#ca8a04","emoji":"👘","stock":true,"tag":"Festive","desc":"Kurta-pajama for festivals and weddings."},
{"id":11,"cat":"Winter","name":"Men Zipper Jacket","price":1199,"mrp":1999,"sizes":["M","L","XL","XXL"],"color":"#1f2937","emoji":"🧥","stock":true,"tag":"Winter Special","desc":"Warm fleece lining, two pockets, sturdy zipper."},
{"id":12,"cat":"Winter","name":"Woolen Shawl","price":549,"mrp":899,"sizes":["Free Size"],"color":"#b45309","emoji":"🧣","stock":true,"tag":"Winter Special","desc":"Soft and warm shawl, for both women and men."}
]};
const parseIdx=t=>{const m=t.match(/id=["']td-data["'][^>]*>\s*window\.TD_DATA\s*=\s*([\s\S]*?);?\s*<\/script>/);if(!m)throw 0;const d=JSON.parse(m[1]);if(!d||!Array.isArray(d.P))throw 0;return d};
const fix=d=>{d.STORE=d.STORE||DEF.STORE;d.CATS=d.CATS||DEF.CATS;d.P=(d.P||[]).map(p=>({id:p.id,cat:p.cat||d.CATS[0],name:p.name||'',price:+p.price||0,mrp:+p.mrp||+p.price||0,sizes:Array.isArray(p.sizes)&&p.sizes.length?p.sizes:['Free Size'],color:p.color||'#9f1239',emoji:p.emoji||'👕',stock:p.stock!==false,tag:p.tag||'',desc:p.desc||'',...(p.photo?{photo:p.photo}:{})}));return d};
async function boot(){try{const l=JSON.parse(localStorage.getItem(KEY)||'null');if(l&&Array.isArray(l.P)){DB=fix(l);return}}catch(e){}
for(const u of ['index.html','./','/index.html','/']){try{const r=await fetch(u,{cache:'no-store'});if(r.ok){DB=fix(parseIdx(await r.text()));return}}catch(e){}}
DB=fix(structuredClone(DEF))}
const getPw=()=>{try{return localStorage.getItem(PW)||'admin123'}catch(e){return'admin123'}};
async function login(){if($('#pw').value!==getPw())return tt('Wrong password');try{sessionStorage.setItem('av_in','1')}catch(e){}await start()}
function logout(){try{sessionStorage.removeItem('av_in')}catch(e){}location.reload()}
$('#pw').onkeydown=e=>{if(e.key==='Enter')login()};
async function start(){await boot();$('#lg').classList.add('hide');$('#app').classList.remove('hide');render()}
try{if(sessionStorage.getItem('av_in')==='1')start()}catch(e){}
const TABS=[['p','👗 Products'],['s','🏪 Shop'],['u','🚀 Publish / Backup']];
function render(){$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
$('#main').innerHTML=!DB?`<div class="card"><b>Data could not be loaded</b><p class="note" style="margin:6px 0">Choose the website's <b>index.html</b> file here (or open the admin from the same folder/domain as index.html).</p><button class="btn pri" style="margin-bottom:8px" onclick="DB=fix(structuredClone(DEF));save('Default data loaded');render()">Load default data</button><input type="file" accept=".html,.json,text/html,application/json" onchange="loadIdx(this.files[0])"></div>`:({p:vP,s:vS,u:vU})[tab]()}
async function loadIdx(f){if(!f)return;try{const t=await f.text();DB=fix(/^\s*\{/.test(t)?JSON.parse(t):parseIdx(t));save('Data loaded');render()}catch(e){tt('This is not a valid index.html / backup .json')}}
/* PRODUCTS */
function vP(){const P=DB.P,n=P.filter(p=>p.stock).length;return`<div class="stats"><div class="stat"><b>${P.length}</b><small>Total items</small></div><div class="stat"><b style="color:#166534">${n}</b><small>In stock</small></div><div class="stat"><b style="color:#b91c1c">${P.length-n}</b><small>Sold out</small></div><div class="stat"><b>${DB.CATS.length}</b><small>Categories</small></div></div>
<div class="row" style="margin-bottom:10px"><input style="flex:1 1 150px;width:auto" placeholder="Search…" value="${esc(q)}" oninput="q=this.value;$('#pl').innerHTML=pl()"><button class="btn pri" onclick="edit()">+ New Item</button></div><div id="pl">${pl()}</div>`}
function pl(){const l=DB.P.filter(p=>(p.name+' '+p.cat).toLowerCase().includes(q.toLowerCase()));if(!l.length)return'<div class="card note">Nothing found.</div>';
return l.map(p=>`<div class="card row bt"><div style="flex:1 1 200px;min-width:0"><b>${p.photo?`<img class="th" src="${p.photo}">`:`<span class="th" style="background:${esc(p.color)}">${esc(p.emoji)}</span>`}${esc(p.name)}</b><span class="bd ${p.stock?'in':'out'}">${p.stock?'IN STOCK':'SOLD OUT'}</span><div class="note">${esc(p.cat)}${p.tag?' • 🏷️ '+esc(p.tag):''} • ${inr(p.price)} <s>${inr(p.mrp)}</s> • ${esc(p.sizes.join(', '))}</div><div class="note">${esc(p.desc||'')}</div></div>
<div class="row"><button class="btn sm" onclick="tg(${p.id})">${p.stock?'Mark sold out':'Back in stock'}</button><button class="btn sm" onclick="edit(${p.id})">Edit</button><button class="btn sm" onclick="dup(${p.id})">Copy</button><button class="btn sm red" onclick="del(${p.id})">Delete</button></div></div>`).join('')}
const nid=()=>Math.max(0,...DB.P.map(p=>p.id))+1,fp=id=>DB.P.find(p=>p.id===id);
function tg(id){const p=fp(id);p.stock=!p.stock;save(p.stock?'Back in stock':'Marked sold out');render()}
function dup(id){const c=structuredClone(fp(id));c.id=nid();c.name+=' (copy)';DB.P.push(c);save('Copy created');render()}
function del(id){if(confirm(`Delete "${fp(id).name}"?`)){DB.P=DB.P.filter(p=>p.id!==id);save('Deleted');render()}}
const cm=()=>$('#md').classList.add('hide');
function edit(id){const p=id?fp(id):{cat:DB.CATS[0],name:'',price:0,mrp:0,sizes:['S','M','L','XL'],color:'#9f1239',emoji:'👕',stock:true,tag:'',desc:''};ph=p.photo||'';
const f=(l,k,v,t='text')=>`<div><label>${l}</label><input id="f_${k}" type="${t}" value="${esc(v)}"></div>`;
$('#bx').innerHTML=`<div class="row bt" style="margin-bottom:10px"><h1>${id?'Edit Item':'New Item'}</h1><button class="btn sm" onclick="cm()">✕</button></div><div class="grid">
<div class="full">${f('Name (e.g. Cotton Kurti)','name',p.name)}</div>
<div><label>Category</label><select id="f_cat">${DB.CATS.map(c=>`<option ${c===p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>${f('Tag (Hot Deal, New…)','tag',p.tag)}
${f('Selling price ₹','price',p.price,'number')}${f('MRP ₹ (shown struck-through)','mrp',p.mrp,'number')}
<div class="full">${f('Sizes (comma separated) — S,M,L or 30,32,34','sizes',p.sizes.join(','))}</div>
<div class="full">${f('Short description','desc',p.desc)}</div>
<div><label>Colour (if no photo)</label><input id="f_color" type="color" value="${esc(p.color)}"></div>${f('Emoji (if no photo)','emoji',p.emoji)}
<div class="full"><label>📷 Photo (optional — auto-resized)</label><div id="phb" class="row" style="margin-bottom:6px"></div><input type="file" accept="image/*" onchange="addPh(this.files[0])"></div>
<div style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="f_stock" ${p.stock?'checked':''}> In stock</div></div>
<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="cm()">Cancel</button><button class="btn pri" onclick="sp(${id||0})">Save</button></div>`;
rph();$('#md').classList.remove('hide')}
function rph(){$('#phb').innerHTML=ph?`<img src="${ph}" style="width:80px;height:80px;object-fit:cover;border-radius:10px"><button class="btn sm red" onclick="ph='';rph()">Remove</button>`:'<span class="note">No photo yet</span>'}
function addPh(file){if(!file)return;const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ph=c.toDataURL('image/jpeg',.72);URL.revokeObjectURL(u);rph()};i.onerror=()=>tt('Could not read the photo');i.src=u}
function sp(id){const g=k=>$('#f_'+k).value.trim(),n=k=>Number(g(k))||0;if(!g('name'))return tt('Name is required');if(n('price')<=0)return tt('Enter a price');
const sizes=g('sizes').split(',').map(s=>s.trim()).filter(Boolean),o={id:id||nid(),cat:g('cat'),name:g('name'),price:n('price'),mrp:n('mrp')||n('price'),sizes:sizes.length?sizes:['Free Size'],color:g('color'),emoji:g('emoji')||'👕',stock:$('#f_stock').checked,tag:g('tag'),desc:g('desc')};
if(ph)o.photo=ph;if(id)DB.P[DB.P.findIndex(x=>x.id===id)]=o;else DB.P.push(o);cm();save(id?'Updated':'Item added');render()}
/* DUKAAN */
function vS(){const s=DB.STORE,f=(l,k,t='text',full)=>`<div class="${full?'full':''}"><label>${l}</label><input id="s_${k}" type="${t}" value="${esc(s[k])}"></div>`;
return`<div class="card"><div class="grid">${f('Shop name','name','text',1)}${f('WhatsApp (with 91, without +)','whatsapp')}${f('Phone (+91…)','phone')}${f('Short location (header)','short')}${f('Free delivery area','delivery')}${f('Full address','address','text',1)}${f('Opening hour (0-23)','openHour','number')}${f('Closing hour (0-23)','closeHour','number')}${f('Timing text','hours','text',1)}
<div class="full"><label>Offer banner (empty = hidden)</label><textarea id="s_offer" rows="2">${esc(s.offer)}</textarea></div>${f('Hero heading','hero','text',1)}<div class="full"><label>Hero sub text</label><textarea id="s_heroSub" rows="2">${esc(s.heroSub)}</textarea></div>
<div class="full"><label>Categories (comma separated, as shown on the website)</label><input id="s_cats" value="${esc(DB.CATS.join(', '))}"><p class="note">Renaming a category may leave old items in the old category — change it in the item edit form.</p></div></div>
<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn pri" onclick="ss()">Save Shop Details</button></div></div>
<div class="card"><b>Change password</b><div class="grid" style="margin-top:8px"><div><label>New password</label><input id="np" type="password"></div><div><label>Repeat</label><input id="np2" type="password"></div></div><button class="btn pri" style="margin-top:10px" onclick="cp()">Update</button><p class="note" style="margin-top:8px">This is a basic lock, not real security. Do not share the admin.html link.</p></div>`}
function ss(){const s=DB.STORE;['name','phone','short','delivery','address','hours','offer','hero','heroSub'].forEach(k=>s[k]=$('#s_'+k).value.trim());s.whatsapp=$('#s_whatsapp').value.replace(/\D/g,'');
s.openHour=Number($('#s_openHour').value)||10;s.closeHour=Number($('#s_closeHour').value)||21;const c=$('#s_cats').value.split(',').map(x=>x.trim()).filter(Boolean);if(c.length)DB.CATS=[...new Set(c)];save('Shop details saved')}
function cp(){const a=$('#np').value;if(a.length<4)return tt('At least 4 characters');if(a!==$('#np2').value)return tt('Passwords do not match');try{localStorage.setItem(PW,a);tt('Password changed')}catch(e){tt('Could not save')}}
/* PUBLISH */
function vU(){return`<div class="card" style="background:#fffbeb;border-color:#fcd34d"><b>Important</b><p class="note">Changes made here are visible only in this browser. To show them to customers, download the <b>updated index.html</b> below and upload it again to your hosting (Vercel).</p></div>
<div class="card"><b>1. Updated website file</b><p class="note" style="margin:6px 0">Puts all your items, photos and shop details into that file.</p><button class="btn pri" onclick="build()">⬇ Download updated index.html</button><p class="note" style="margin-top:10px">If that does not work, choose your index.html here:</p><input type="file" accept=".html" onchange="buildF(this.files[0])"></div>
<div class="card"><b>2. Backup / Restore</b><div class="row" style="margin-top:8px"><button class="btn" onclick="dl('arun-vastralaya-backup.json',JSON.stringify(DB,null,2),'application/json')">⬇ Backup (.json)</button><label class="btn" style="margin:0;cursor:pointer">⬆ Restore<input type="file" accept=".json" class="hide" onchange="imp(this.files[0])"></label></div></div>
<div class="card"><b>3. Reset</b><p class="note" style="margin:6px 0">Restore all data to the original demo.</p><button class="btn red" onclick="rs()">Reset to original</button></div>`}
function dl(n,t,y){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:y}));a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function mk(h){if(!/<script id="td-data">[\s\S]*?<\/script>/.test(h)){tt('This does not look like the right index.html');return null}
const j=JSON.stringify({STORE:DB.STORE,CATS:DB.CATS,P:DB.P}).replace(/</g,'\\u003c');return h.replace(/<script id="td-data">[\s\S]*?<\/script>/,()=>`<script id="td-data">window.TD_DATA=${j};<\/script>`)}
async function build(){try{const r=await fetch('index.html',{cache:'no-store'});if(!r.ok)throw 0;const o=mk(await r.text());if(o){dl('index.html',o,'text/html');tt('index.html ready')}}catch(e){tt('Auto-load failed — choose the file below')}}
async function buildF(f){if(!f)return;const o=mk(await f.text());if(o){dl('index.html',o,'text/html');tt('index.html read
